<!DOCTYPE html>
<html>
<head>
    <title>Responsive Webpage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            font-family: Arial;
            margin:0;
        }

        header{
            background: #4CAF50;
            color:white;
            text-align:center;
            padding:20px;
        }

        nav{
            background:#333;
            overflow:hidden;
        }

        nav a{
            float:left;
            color:white;
            text-decoration:none;
            padding:14px 20px;
        }

        nav a:hover{
            background:#ddd;
            color:black;
        }

        .container{
            display:flex;
            flex-wrap:wrap;
            padding:20px;
        }

        .box{
            flex:30%;
            background:#f2f2f2;
            margin:10px;
            padding:20px;
            text-align:center;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:10px;
        }

        /* Responsive layout */
        @media (max-width:768px){
            .box{
                flex:100%;
            }

            nav a{
                float:none;
                display:block;
                text-align:center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>My Responsive Website</h1>
    <p>Resize the browser window to see the effect</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <div class="box">
        <h2>Section 1</h2>
        <p>This is a responsive section.</p>
    </div>

    <div class="box">
        <h2>Section 2</h2>
        <p>This layout adjusts for different screen sizes.</p>
    </div>

    <div class="box">
        <h2>Section 3</h2>
        <p>Works on mobile, tablet and desktop.</p>
    </div>
</div>

<footer>
    <p>© 2026 My Website</p>
</footer>

</body>
</html>
