<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu Card</title>
    <style>
        body{
            font-family: Arial;
            background-color:#f4f4f4;
            text-align:center;
        }

        .menu{
            width:400px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            color:#d35400;
        }

        table{
            width:100%;
            margin-top:20px;
        }

        th,td{
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#f39c12;
            color:white;
        }
    </style>
</head>

<body>

<div class="menu">
    <h1>Restaurant Menu</h1>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Veg Biryani</td>
            <td>₹150</td>
        </tr>

        <tr>
            <td>Chicken Biryani</td>
            <td>₹220</td>
        </tr>

        <tr>
            <td>Paneer Butter Masala</td>
            <td>₹180</td>
        </tr>

        <tr>
            <td>Masala Dosa</td>
            <td>₹90</td>
        </tr>

        <tr>
            <td>Fried Rice</td>
            <td>₹130</td>
        </tr>

        <tr>
            <td>Ice Cream</td>
            <td>₹60</td>
        </tr>
    </table>

</div>

</body>
</html>
