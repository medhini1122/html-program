<!DOCTYPE html>
<html>
<head>
    <title>Simple Table Example</title>
</head>
<body>

<h2>Student Details</h2>

<table border="1">
    <tr>
        <th>Roll No</th>
        <th>Name</th>
        <th>Class</th>
        <th>Marks</th>
    </tr>
    
    <tr>
        <td>1</td>
        <td>Rahul</td>
        <td>10</td>
        <td>85</td>
    </tr>
    
    <tr>
        <td>2</td>
        <td>Anita</td>
        <td>10</td>
        <td>90</td>
    </tr>
    
    <tr>
        <td>3</td>
        <td>Ravi</td>
        <td>10</td>
        <td>78</td>
    </tr>

</table>

</body>
</html>
